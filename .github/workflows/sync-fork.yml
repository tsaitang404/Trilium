name: Sync fork with upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync code with upstream
        run: |
          git config user.name "tsaitang404"
          git config user.email "tsaitang.agent@gmail.com"
          git remote add upstream "https://github.com/TriliumNext/Trilium.git"
          git fetch upstream main
          git checkout main
          git reset --hard "upstream/main"
          # Restore our sync-fork.yml since upstream doesn't have it
          git show origin/main:.github/workflows/sync-fork.yml > .github/workflows/sync-fork.yml
          git add .github/workflows/sync-fork.yml
          git commit -m "chore: restore sync-fork.yml" || true
          git push --force origin main

      - name: Mirror upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin maintenance
          git show FETCH_HEAD:scripts/mirror-releases.sh > /tmp/mirror-releases.sh
          chmod +x /tmp/mirror-releases.sh
          /tmp/mirror-releases.sh TriliumNext/Trilium tsaitang404/Trilium 5
