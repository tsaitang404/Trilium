name: Update model prices

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-model-prices:
    name: Refresh model_prices.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up node and dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate the price table
        run: pnpm --filter @triliumnext/core update-model-prices
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/trilium-core/src/services/llm/providers/model_prices.json
          git diff --staged --quiet || git commit -m "chore(llm): refresh model price table"
          git push
